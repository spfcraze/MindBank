<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindBank — Neural Graph</title>
<style>
/* === BRAIN_3D CRT THEME === */
:root{
  --bg:#050608;
  --bg-panel:rgba(11,14,20,0.85);
  --bg-elevated:rgba(15,20,30,0.6);
  --border:rgba(0,212,170,0.15);
  --border-subtle:rgba(0,212,170,0.08);
  --text:#E8ECF0;
  --text-body:#B8C2CC;
  --text-dim:#8A9AAA;
  --text-faint:#5A6A7A;
  --text-muted:#3A4550;
  --accent:#00D4AA;
  --accent-dim:#3A9D8A;
  --accent-glow:rgba(0,212,170,0.15);
  --red:#EF4444;
  --yellow:#F5C518;
  --blue:#3B82F6;
  --magenta:#EC4899;
  --cyan:#00D4AA;
  --green:#39FF14;
  --font-mono:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',monospace;
  --font-sans:'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif;
  --radius-sm:3px;
  --radius-md:5px;
  --radius-lg:8px;
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
  --space-xl:24px;
  --crt-scanline:rgba(0,0,0,0.06);
  --crt-glow:0 0 8px rgba(0,212,170,0.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  overflow:hidden;
  font-family:var(--font-mono);
  color:var(--text);
  font-size:11px;
  line-height:1.5;
}
/* CRT grid background */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:linear-gradient(var(--border-subtle) 1px,transparent 1px),linear-gradient(90deg,var(--border-subtle) 1px,transparent 1px);
  background-size:80px 80px;
  pointer-events:none;
  z-index:0;
}
canvas{display:block;position:absolute;top:0;left:0;z-index:1}

/* Embed mode */
body.embed-mode .sidebar{top:0}
body.embed-mode canvas{left:280px}
body.embed-mode .topbar{left:290px}

/* === SIDEBAR === */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:280px;
  background:var(--bg-panel);
  border-right:1px solid var(--border);
  z-index:10;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
}
.sidebar::-webkit-scrollbar{width:2px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}

/* Header */
.sidebar-head{
  padding:var(--space-md) var(--space-lg);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:var(--space-sm)
}
.sidebar-head h1{
  font-family:var(--font-sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--accent);
  text-transform:uppercase
}
.sidebar-head .pulse-ring{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse-ring 2.5s infinite
}
@keyframes pulse-ring{0%,100%{opacity:1}50%{opacity:.3}}

/* Stats bar - compact, data-dense */
.stats-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--border);
  padding:var(--space-sm) var(--space-md);
  gap:var(--space-xs)
}
.stat{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:var(--space-xs) 0
}
.stat .val{
  font-family:var(--font-mono);
  font-size:14px;
  font-weight:700;
  color:var(--accent);
  line-height:1
}
.stat .lbl{
  font-size:8px;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:.5px;
  font-weight:500
}

/* === WIDGET SYSTEM === */
.widget-container{
  display:flex;
  flex-direction:column;
  flex:1;
  overflow-y:auto;
  overflow-x:hidden
}
.widget-container::-webkit-scrollbar{width:2px}
.widget-container::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}
.widget{
  background:var(--bg-panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0
}
.widget-header{
  padding:var(--space-sm) var(--space-md);
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  user-select:none;
  transition:background .15s
}
.widget-header:hover{background:var(--bg-elevated)}
.widget.collapsed .widget-header{border-bottom:none}
.widget-title{
  font-family:var(--font-sans);
  font-size:9px;
  font-weight:600;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:1.5px;
  display:flex;
  align-items:center;
  gap:var(--space-sm)
}
.widget-title .w-icon{
  font-size:8px;
  color:var(--text-faint);
  transition:transform .2s
}
.widget.collapsed .widget-title .w-icon{transform:rotate(-90deg)}
.widget-controls{
  display:flex;
  align-items:center;
  gap:var(--space-xs)
}
.widget-btn{
  background:none;
  border:none;
  color:var(--text-faint);
  cursor:pointer;
  font-size:8px;
  padding:2px 4px;
  border-radius:var(--radius-sm);
  transition:all .15s;
  font-family:var(--font-mono)
}
.widget-btn:hover{color:var(--accent)}
.widget-body{
  overflow-y:auto;
  transition:max-height .25s ease,opacity .2s ease;
  max-height:400px;
  opacity:1
}
.widget.collapsed .widget-body{max-height:0;opacity:0;overflow:hidden}
.widget-body::-webkit-scrollbar{width:2px}
.widget-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}

/* Data rows - compact bar charts */
.data-section{
  padding:var(--space-sm) 0;
  max-height:220px;
  overflow-y:auto;
  flex-shrink:0
}
.data-section::-webkit-scrollbar{width:2px}
.data-section::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}
.data-title{
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:600;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:1.5px;
  padding:0 var(--space-md);
  margin-bottom:var(--space-xs)
}
.data-row{
  display:flex;
  align-items:center;
  gap:var(--space-sm);
  padding:3px var(--space-md);
  cursor:pointer;
  transition:background .15s
}
.data-row:hover{background:var(--bg-elevated)}
.data-row .ext{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-dim);
  width:28px;
  text-align:right;
  font-weight:600;
  flex-shrink:0
}
.data-row .bar-wrap{
  flex:1;
  height:3px;
  background:var(--bg-elevated);
  border-radius:2px;
  overflow:hidden
}
.data-row .bar{
  height:100%;
  border-radius:2px;
  transition:width .6s ease
}
.data-row .count{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-dim);
  min-width:24px;
  text-align:right
}

/* Namespace chips */
.ns-list{
  padding:var(--space-sm) var(--space-md);
  max-height:200px;
  overflow-y:auto;
  flex-shrink:0
}
.ns-list::-webkit-scrollbar{width:2px}
.ns-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}
.ns-chip{
  display:flex;
  align-items:center;
  gap:var(--space-sm);
  padding:4px 6px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  margin-bottom:2px;
  transition:background .2s
}
.ns-chip:hover{background:var(--bg-elevated)}
.ns-chip.active{
  background:var(--accent-glow);
  border:1px solid var(--accent-dim)
}
.ns-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  flex-shrink:0
}
.ns-name{
  font-family:var(--font-sans);
  font-size:10px;
  color:var(--text-body);
  flex:1;
  font-weight:500
}
.ns-count{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-faint);
  background:var(--bg-elevated);
  padding:1px 5px;
  border-radius:var(--radius-sm)
}

/* Activity feed */
.feed{
  display:flex;
  flex-direction:column;
  flex-shrink:0
}
.feed-items{
  max-height:200px;
  overflow-y:auto;
  padding:var(--space-xs) 0
}
.feed-items::-webkit-scrollbar{width:2px}
.feed-items::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}
.feed-item{
  padding:var(--space-sm) var(--space-md);
  border-bottom:1px solid var(--border);
  font-size:10px;
  animation:slide-in .3s ease-out
}
@keyframes slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.feed-item .fi-header{
  display:flex;
  align-items:center;
  gap:var(--space-xs);
  margin-bottom:2px
}
.feed-item .fi-time{
  font-family:var(--font-mono);
  font-size:8px;
  color:var(--text-muted)
}
.feed-item .fi-badge{
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:700;
  padding:1px 5px;
  border-radius:var(--radius-sm);
  text-transform:uppercase;
  letter-spacing:.3px
}
.feed-item .fi-text{
  color:var(--text-dim);
  margin-top:2px;
  line-height:1.4;
  font-size:9px
}
.feed-item .fi-nodes{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  margin-top:3px
}
.feed-item .fi-node{
  font-size:8px;
  padding:1px 5px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:opacity .15s;
  font-family:var(--font-mono)
}
.feed-item .fi-node:hover{opacity:.6}

/* Legend */
.legend{
  padding:var(--space-sm) var(--space-md);
  flex-shrink:0
}
.legend h3{
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:600;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:var(--space-xs)
}
.legend-items{
  display:flex;
  flex-wrap:wrap;
  gap:var(--space-xs)
}
.legend-item{
  display:flex;
  align-items:center;
  gap:3px;
  font-size:9px;
  color:var(--text-dim);
  cursor:pointer;
  padding:2px 5px;
  border-radius:var(--radius-sm);
  transition:all .15s;
  font-family:var(--font-mono)
}
.legend-item:hover{
  background:var(--bg-elevated);
  color:var(--text-body)
}
.legend-item.active{
  background:var(--accent-glow);
  color:var(--accent);
  border:1px solid var(--accent-dim)
}
.legend-dot{
  width:5px;
  height:5px;
  border-radius:50%
}

/* === TOP BAR === */
.topbar{
  position:fixed;
  left:280px;
  top:0;
  right:0;
  height:36px;
  background:var(--bg-panel);
  border-bottom:1px solid var(--border);
  z-index:10;
  display:flex;
  align-items:center;
  padding:0 var(--space-md);
  gap:var(--space-sm)
}
.topbar .sep{
  width:1px;
  height:14px;
  background:var(--border);
  margin:0 2px
}
.topbar button{
  background:rgba(0,212,170,0.04);
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:3px 10px;
  border-radius:var(--radius-sm);
  font-family:var(--font-mono);
  font-size:9px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  text-transform:uppercase;
  letter-spacing:.3px
}
.topbar button:hover{
  background:rgba(0,212,170,0.08);
  color:var(--accent);
  border-color:var(--accent-dim)
}
.topbar button.active{
  background:var(--accent);
  color:var(--bg);
  border-color:var(--accent)
}
.search-wrap{
  position:relative;
  flex:1;
  max-width:280px
}
.search-wrap input{
  width:100%;
  background:rgba(0,212,170,0.04);
  color:var(--text);
  border:1px solid var(--border);
  padding:3px 10px;
  border-radius:var(--radius-sm);
  font-family:var(--font-mono);
  font-size:9px;
  outline:none
}
.search-wrap input:focus{
  border-color:var(--accent-dim);
  background:var(--bg)
}
.search-wrap input::placeholder{color:var(--text-muted)}

/* HUD readouts in top bar */
.hud-readout{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-faint);
  background:rgba(0,212,170,0.04);
  border:1px solid var(--border);
  padding:2px 8px;
  border-radius:var(--radius-sm);
  letter-spacing:.3px;
  min-width:48px;
  text-align:center
}

/* === DETAIL PANEL === */
.panel{
  position:fixed;
  right:-400px;
  top:0;
  bottom:0;
  width:400px;
  background:var(--bg-panel);
  border-left:1px solid var(--border);
  z-index:20;
  transition:right .3s;
  overflow-y:auto
}
.panel.open{right:0}
.panel .x{
  position:absolute;
  top:var(--space-sm);
  right:var(--space-md);
  background:none;
  border:none;
  color:var(--red);
  font-size:16px;
  cursor:pointer;
  padding:4px
}
.ph{
  padding:var(--space-lg);
  border-bottom:1px solid var(--border)
}
.ph .tag{
  display:inline-block;
  padding:2px 8px;
  border-radius:var(--radius-sm);
  font-family:var(--font-sans);
  font-size:9px;
  font-weight:700;
  margin-bottom:var(--space-sm);
  text-transform:uppercase;
  letter-spacing:.5px
}
.ph h2{
  font-family:var(--font-sans);
  font-size:16px;
  font-weight:700;
  color:var(--accent);
  margin-bottom:3px;
  letter-spacing:-.2px
}
.ph .meta{
  font-family:var(--font-mono);
  color:var(--text-dim);
  font-size:9px;
  letter-spacing:.3px
}
.ph .del-btn{
  display:inline-block;
  margin-top:var(--space-sm);
  padding:3px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--red);
  background:transparent;
  color:var(--red);
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  cursor:pointer;
  transition:all .15s
}
.ph .del-btn:hover{
  background:var(--red);
  color:var(--bg)
}
.pb{
  padding:var(--space-lg)
}
.pb h3{
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:600;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:1px;
  margin:var(--space-md) 0 var(--space-xs)
}
.pb .c{
  color:var(--text-body);
  font-size:11px;
  line-height:1.6;
  word-break:break-word
}
.pb .nb{
  display:flex;
  align-items:center;
  gap:var(--space-sm);
  padding:5px 0;
  border-bottom:1px solid var(--border);
  font-size:10px;
  cursor:pointer;
  color:var(--text-dim);
  transition:color .15s;
  font-family:var(--font-mono)
}
.pb .nb:hover{color:var(--accent)}
.nb-type{
  width:5px;
  height:5px;
  border-radius:50%;
  flex-shrink:0
}
.nb-edge{
  font-size:8px;
  color:var(--text-faint);
  min-width:70px;
  font-family:var(--font-mono)
}

/* Detail panel metadata grid */
.meta-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--space-xs);
  margin-bottom:var(--space-md);
  padding:var(--space-sm);
  background:var(--bg-elevated);
  border-radius:var(--radius-sm);
  border:1px solid var(--border)
}
.meta-cell{
  display:flex;
  flex-direction:column;
  gap:1px
}
.meta-key{
  font-family:var(--font-sans);
  font-size:7px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:.5px
}
.meta-val{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-body)
}
.meta-val.id{
  cursor:pointer;
  transition:color .15s
}
.meta-val.id:hover{color:var(--accent)}
.meta-val.id::after{
  content:' \00b6';
  color:var(--text-faint);
  font-size:8px
}

/* Connection stats mini-viz */
.h3-count{
  font-family:var(--font-mono);
  font-size:9px;
  color:var(--text-faint);
  margin-left:4px
}
.conn-stats{
  display:flex;
  flex-wrap:wrap;
  gap:var(--space-xs);
  margin-bottom:var(--space-sm);
  padding:var(--space-xs) 0
}
.conn-stat{
  display:flex;
  align-items:center;
  gap:3px;
  font-family:var(--font-mono);
  font-size:8px;
  color:var(--text-dim);
  background:var(--bg-elevated);
  padding:2px 6px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border)
}
.conn-stat-bar{
  width:20px;
  height:2px;
  background:var(--border);
  border-radius:1px;
  overflow:hidden
}
.conn-stat-bar>div{
  height:100%;
  border-radius:1px
}

/* Toast */
.toast{
  position:fixed;
  bottom:var(--space-lg);
  left:50%;
  transform:translateX(-50%);
  background:var(--bg-elevated);
  color:var(--accent);
  border:1px solid var(--accent-dim);
  padding:6px 16px;
  border-radius:var(--radius-md);
  font-size:10px;
  z-index:30;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  font-family:var(--font-mono)
}
.toast.show{opacity:1}

/* Burst overlay */
.burst-canvas{
  position:fixed;
  pointer-events:none;
  z-index:5
}

/* Recall popup */
.recall-popup{
  position:fixed;
  pointer-events:none;
  z-index:25;
  animation:recall-fade 3s forwards
}
@keyframes recall-fade{
  0%{opacity:0;transform:translateY(10px) scale(.9)}
  10%{opacity:1;transform:translateY(0) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translateY(-20px)}
}
.recall-popup .rp-card{
  background:var(--bg-panel);
  border:1px solid var(--accent-dim);
  border-radius:var(--radius-md);
  padding:var(--space-sm) var(--space-md);
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  max-width:280px
}
.recall-popup .rp-type{
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:3px
}
.recall-popup .rp-text{
  font-size:10px;
  color:var(--text-body);
  line-height:1.4
}

/* Hover card */
#hoverCard{
  display:none;
  position:fixed;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:var(--space-sm) var(--space-md);
  font-size:10px;
  color:var(--text);
  z-index:20;
  pointer-events:none;
  max-width:280px;
  box-shadow:0 4px 16px rgba(0,0,0,0.3)
}

/* Status indicator in detail panel */
#statusIndicator{
  display:none;
  margin-bottom:8px;
  padding:6px 10px;
  border-radius:5px;
  font-size:10px;
  font-family:var(--font-mono);
  border:1px solid var(--border)
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-head">
    <div class="pulse-ring"></div>
    <h1><a href="/" style="color:var(--accent);text-decoration:none;">MIND_BANK // GRAPH</a></h1>
  </div>
  <div class="stats-bar">
    <div class="stat"><div class="val" id="sn">-</div><div class="lbl">Nodes</div></div>
    <div class="stat"><div class="val" id="se">-</div><div class="lbl">Edges</div></div>
    <div class="stat"><div class="val" id="sf">-</div><div class="lbl">FPS</div></div>
    <div class="stat"><div class="val" id="sr">0</div><div class="lbl">Recalls</div></div>
    <div class="stat"><div class="val" id="sc">0</div><div class="lbl">Conflicts</div></div>
    <div class="stat"><div class="val" id="sd">-</div><div class="lbl">Dream</div></div>
  </div>
  <div class="widget-container" id="widgetContainer">
    <!-- Memory Types Widget -->
    <div class="widget" id="widget-memory">
      <div class="widget-header" onclick="toggleWidget('memory')">
        <span class="widget-title"><span class="w-icon">▾</span> Memory Types</span>
        <div class="widget-controls">
          <button class="widget-btn" onclick="event.stopPropagation();toggleWidget('memory')" title="Collapse">▼</button>
        </div>
      </div>

<script>
// === Node type config - NO EMOJI, geometric only ===
/* === Refined ink palette — less neon, more depth === */
const TC={
  project:{c:'#2dd4a0',r:[45,212,160],s:16,icon:'P',shape:'hex',label:'PROJECT',glow:true},
  decision:{c:'#5b9bd5',r:[91,155,213],s:14,icon:'D',shape:'diamond',label:'DECISION',glow:true},
  fact:{c:'#d4a656',r:[212,166,86],s:11,icon:'F',shape:'circle',label:'FACT',glow:false},
  preference:{c:'#c084c0',r:[192,132,192],s:11,icon:'Pr',shape:'rounded',label:'PREF',glow:false},
  problem:{c:'#d45757',r:[212,87,87],s:13,icon:'Pb',shape:'triangle',label:'PROB',glow:true},
  advice:{c:'#7bc47b',r:[123,196,123],s:11,icon:'A',shape:'bubble',label:'ADVICE',glow:false},
  topic:{c:'#7a8fd4',r:[122,143,212],s:12,icon:'T',shape:'tag',label:'TOPIC',glow:false},
  person:{c:'#d4945a',r:[212,148,90],s:14,icon:'Pe',shape:'person',label:'PERSON',glow:false},
  event:{c:'#5ac8c8',r:[90,200,200],s:11,icon:'E',shape:'calendar',label:'EVENT',glow:false},
  concept:{c:'#9aa0d4',r:[154,160,212],s:10,icon:'C',shape:'cloud',label:'CONCEPT',glow:false},
  agent:{c:'#d48ab0',r:[212,138,176],s:14,icon:'Ag',shape:'gear',label:'AGENT',glow:true},
  question:{c:'#d4a85a',r:[212,168,90],s:11,icon:'Q',shape:'circle',label:'QUESTION',glow:false}
};

const RECALL_TYPES={search:'#d4a656',ask:'#5b9bd5',recall:'#2dd4a0',snapshot:'#c084c0',edge:'#9aa0d4',create:'#7bc47b'};

// Edge type visual styles - IMPROVED VISIBILITY
const EDGE_STYLES={
  relates_to:  {color:[120,120,140],rgba:'rgba(120,120,140,',dash:null,    width:1.5, glow:false, arrow:true, label:'relates'},
  contains:    {color:[80,150,240], rgba:'rgba(80,150,240,', dash:null,    width:2,   glow:false, arrow:true, label:'contains'},
  supports:    {color:[0,220,120],  rgba:'rgba(0,220,120,', dash:null,    width:2.5, glow:true,  arrow:true, label:'supports'},
  depends_on:  {color:[255,180,0],  rgba:'rgba(255,180,0,', dash:[8,4],   width:2,   glow:true,  arrow:true, label:'depends'},
  decided_by:  {color:[190,120,255],rgba:'rgba(190,120,255,',dash:[4,4],  width:1.8, glow:false, arrow:true, label:'decided'},
  contradicts: {color:[255,80,80],  rgba:'rgba(255,80,80,', dash:[6,6],   width:2.5, glow:true,  arrow:true, label:'contradicts'},
};

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const burstCanvas=document.getElementById('burstC'),bctx=burstCanvas.getContext('2d');
let W,H,nodes=[],edges=[],nodeMap=new Map(),cam={x:0,y:0,z:1},camTargetZ=1,autoR=false,showLabels=true;
let drag=false,dragStart={x:0,y:0},camStart={x:0,y:0},hovered=null,selected=null;
let particles=[],bursts=[],recallPopups=[];
let recallCount=0,nsFilter='',typeFilter='',activityFeed=[],searchQuery='';
let lastSnapshotCount=0,lastNodeCount=0;
let healthMode=false,selectedNode=null,connectedSet=null;

let resizeTimer;
function resize(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    W=canvas.width=innerWidth;H=canvas.height=innerHeight;
    burstCanvas.width=W;burstCanvas.height=H;
    burstCanvas.style.width=W+'px';burstCanvas.style.height=H+'px';
  },100);
}
window.onresize=resize;resize();

// Embed mode: hide sidebar when loaded in iframe
if(new URLSearchParams(location.search).get('embed'))document.body.classList.add('embed-mode');

// === Data Loading ===
async function load(){
  toast('Loading graph...');
  const d=await(await fetch('/api/v1/graph?limit=200')).json();
  try{
    const cnt=await(await fetch('/api/v1/nodes?limit=1&count=true')).json();
    lastNodeCount=cnt.count||d.nodes.length;
    document.getElementById('sn').textContent=lastNodeCount;
  }catch(e){
    lastNodeCount=d.nodes.length;
    document.getElementById('sn').textContent=d.nodes.length;
  }
  try{
    const edgeCnt=await(await fetch('/api/v1/edges?count=true')).json();
    document.getElementById('se').textContent=edgeCnt.count||d.edges.length;
  }catch(e){
    document.getElementById('se').textContent=d.edges.length;
  }
  // Fetch conflict count
  try{
    const conflicts=await(await fetch('/api/v1/conflicts')).json();
    document.getElementById('sc').textContent=conflicts.count||0;
  }catch(e){
    document.getElementById('sc').textContent='0';
  }
  // Fetch dream status
  try{
    const dream=await(await fetch('/api/v1/dream/status')).json();
    document.getElementById('sd').textContent=dream.cycle_id||'-';
  }catch(e){
    document.getElementById('sd').textContent='-';
  }
  buildGraph(d);
  updateEmptyState();
  wakeRender();
  renderLegend(d);
  fetchNamespaceCounts().then(nsCounts=>{
    if(nsCounts){
      renderNamespaceChips(null);
    }else{
      renderNamespaceChips(d);
    }
  });
  renderDataSidebar(d);
  toast(d.nodes.length+' nodes loaded');
  initWidgets();
  setTimeout(()=>zoomFit(),1500);
}

function buildGraph(data){
  for(const e of edges){e.particles.length=0;}
  edges.length=0;
  bursts.length=0;
  nodeMap.clear();
  nodes.forEach(n=>{n.glowTrail.length=0;});
  nodes.length=0;
  physicsSettled=false;
  settleCounter=0;

  nodes=data.nodes.map((n,i)=>{
    const tc=TC[n.node_type]||TC.concept;
    const angle=(i/data.nodes.length)*Math.PI*2;
    const radius=300+Math.random()*300;
    return{id:n.id,label:n.label,type:n.node_type,ns:n.namespace,
      summary:n.summary,content:n.content,imp:n.importance||0.5,acc:n.access_count||0,
      status:n.status||'open',confirmation_count:n.confirmation_count||0,
      x:Math.cos(angle)*radius,y:Math.sin(angle)*radius,vx:0,vy:0,
      color:tc.c,rgb:tc.r,
      rgba:`rgba(${tc.r[0]},${tc.r[1]},${tc.r[2]},`,
      rgbaFull:`rgba(${tc.r[0]},${tc.r[1]},${tc.r[2]},1)`,
      size:tc.s*Math.min(1.4,0.6+Math.min(n.importance||0.5,1)*0.4+Math.log2(1+Math.min(n.access_count||0,100))*0.08),
      health:0,
      icon:tc.icon,typeLabel:tc.label,
      pulse:Math.random()*Math.PI*2,visible:true,highlighted:false,
      glowTrail:[]};
  });
  for(const n of nodes)nodeMap.set(n.id,n);

  edges=data.edges.map(e=>{
    const es=EDGE_STYLES[e.edge_type]||EDGE_STYLES.relates_to;
    return{src:e.source,dst:e.target,type:e.edge_type,w:e.weight||1,salience:e.salience||1.0,
      style:es,
      particles:[],nextSpawn:Math.random()*60,burstTimer:0,glow:0};
  });

  const edgeCount={};
  for(const e of edges){
    edgeCount[e.src]=(edgeCount[e.src]||0)+1;
    edgeCount[e.dst]=(edgeCount[e.dst]||0)+1;
  }
  const maxConn=Math.max(...Object.values(edgeCount),1);
  for(const n of nodes){
    const conn=(edgeCount[n.id]||0)/maxConn;
    const imp=n.imp||0.5;
    const acc=Math.min(n.acc||0,100)/100;
    n.health=Math.min(1,conn*0.4+imp*0.3+acc*0.3);
  }

  cam={x:0,y:0,z:1};camTargetZ=1;
  visNodesCache.length=0;
  physicsFrame=0;
  wakeRender();
}

// === Physics ===
let physicsFrame=0;
let visNodesCache=[];
let physicsSettled=false;
let settleCounter=0;

function physics(){
  physicsFrame++;
  if(physicsSettled&&physicsFrame%60!==0)return;
  visNodesCache.length=0;
  for(const n of nodes){if(n.visible)visNodesCache.push(n);}
  const visCount=visNodesCache.length;
  if(visCount===0)return;
  if(physicsSettled){
    let anyMoving=false;
    for(const n of visNodesCache){
      if(Math.abs(n.vx)>0.01||Math.abs(n.vy)>0.01){anyMoving=true;break;}
    }
    if(!anyMoving)return;
    physicsSettled=false;settleCounter=0;
  }

  const damping=0.82,centerPull=0.004,maxSpeed=6,repulsionBase=6000,attractionStr=0.004,idealDist=150,repulsionDist2=250000;
  const skipRepulsion=visCount>60&&physicsFrame%2===0;

  if(!skipRepulsion){
    for(let i=0;i<visCount;i++){
      const a=visNodesCache[i];const aR=a.size*1.2;
      for(let j=i+1;j<visCount;j++){
        const b=visNodesCache[j];const bR=b.size*1.2;
        const dx=a.x-b.x,dy=a.y-b.y;const d2=dx*dx+dy*dy;
        if(d2>repulsionDist2)continue;
        const dist=Math.sqrt(d2)||1;const minDist=aR+bR;
        if(dist<minDist){
          const overlap=minDist-dist;const nx=dx/dist,ny=dy/dist;
          const pushStrength=Math.min(1,overlap/(minDist*0.3))*0.8;
          a.x+=nx*overlap*pushStrength;a.y+=ny*overlap*pushStrength;
          b.x-=nx*overlap*pushStrength;b.y-=ny*overlap*pushStrength;
          const vDotN=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
          if(vDotN<0){a.vx-=nx*vDotN*0.7;a.vy-=ny*vDotN*0.7;b.vx+=nx*vDotN*0.7;b.vy+=ny*vDotN*0.7;}
          if(Math.random()<0.1){a.vx+=(Math.random()-0.5)*0.2;a.vy+=(Math.random()-0.5)*0.2;}
        }
        const combinedSize=aR+bR;const softDist2=Math.max(d2,combinedSize*combinedSize*0.25);
        const strength=repulsionBase*(combinedSize/30);let f=strength/(softDist2||1);
        const nearField=Math.max(0,1-dist/(combinedSize*2));f+=nearField*0.5;f=Math.min(f,1.5);
        const invDist=1/dist;const fx=dx*invDist*f,fy=dy*invDist*f;
        a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
      }
      a.vx-=a.x*centerPull;a.vy-=a.y*centerPull;
    }
  }

  if(!skipRepulsion&&visCount>10){
    for(const e of edges){
      const a=nodeMap.get(e.src),b=nodeMap.get(e.dst);
      if(!a||!b||!a.visible||!b.visible||a.ns!==b.ns)continue;
      const dx=b.x-a.x,dy=b.y-a.y;const dist=Math.sqrt(dx*dx+dy*dy)||1;
      if(dist>400)continue;
      const f=0.001*Math.min(1,400/dist);
      a.vx+=dx/dist*f;a.vy+=dy/dist*f;b.vx-=dx/dist*f;b.vy-=dy/dist*f;
    }
  }

  if(!skipRepulsion){
    const edgeCap=Math.min(edges.length,300);
    for(let ei=0;ei<edgeCap;ei++){
      const e=edges[ei];const a=nodeMap.get(e.src),b=nodeMap.get(e.dst);
      if(!a||!b||!a.visible||!b.visible)continue;
      const dx=b.x-a.x,dy=b.y-a.y;const d2=dx*dx+dy*dy;
      if(d2>repulsionDist2*4)continue;
      const dist=Math.sqrt(d2)||1;const minDist=(a.size+b.size)*1.5;
      const target=Math.max(idealDist,minDist);let f=(dist-target)*attractionStr*e.w;
      f=Math.max(-2,Math.min(2,f));const invDist=1/dist;
      a.vx+=dx*invDist*f;a.vy+=dy*invDist*f;b.vx-=dx*invDist*f;b.vy-=dy*invDist*f;
    }
  }

  let totalMovement=0;
  for(const n of nodes){
    if(!n.visible){n.vx=0;n.vy=0;continue;}
    const sizeDamping=Math.max(0.7,0.9-n.size*0.005);n.vx*=sizeDamping;n.vy*=sizeDamping;
    const sizeSpeedCap=Math.max(3,maxSpeed-n.size*0.1);const speed=Math.sqrt(n.vx*n.vx+n.vy*n.vy);
    if(speed>sizeSpeedCap){const s=sizeSpeedCap/speed;n.vx*=s;n.vy*=s;}
    const bound=800;const bs=0.3+n.size*0.01;
    if(n.x<-bound)n.vx+=bs;if(n.x>bound)n.vx-=bs;if(n.y<-bound)n.vy+=bs;if(n.y>bound)n.vy-=bs;
    if(Math.abs(n.vx)<0.01)n.vx=0;if(Math.abs(n.vy)<0.01)n.vy=0;
    n.x+=n.vx;n.y+=n.vy;
    if(!isFinite(n.x))n.x=0;if(!isFinite(n.y))n.y=0;if(!isFinite(n.vx))n.vx=0;if(!isFinite(n.vy))n.vy=0;
    totalMovement+=Math.abs(n.vx)+Math.abs(n.vy);
  }
  if(totalMovement<visCount*0.15){settleCounter++;if(settleCounter>30)physicsSettled=true;}
  else{settleCounter=0;}
  if(physicsFrame>200&&!physicsSettled)physicsSettled=true;
}

// === Render loop control ===
function wakeRender(){physicsSettled=false;settleCounter=0;renderIdle=false;if(renderRunning){if(animFrameId)cancelAnimationFrame(animFrameId);animFrameId=requestAnimationFrame(render);}}
function rebuildVisCache(){visNodesCache.length=0;for(const n of nodes){if(n.visible)visNodesCache.push(n);}}

// === Render ===
let frameCount=0,lastFps=performance.now(),renderRunning=true,simTimer=null;
let renderIdle=false;
let animFrameId=null;
const PROF={frames:0,totalMs:0,nodeMs:0,edgeMs:0,partMs:0,burstMs:0,gridMs:0,nodesDrawn:0,edgesDrawn:0,particlesDrawn:0,lastLog:0};
function logProf(){
  const f=PROF.frames||1;
  console.table({zoom:{value:cam.z.toFixed(3)},fps:{value:(1000/(PROF.totalMs/f)).toFixed(1)},frameMs:{value:(PROF.totalMs/f).toFixed(2)},nodeMs:{value:(PROF.nodeMs/f).toFixed(2)},edgeMs:{value:(PROF.edgeMs/f).toFixed(2)},partMs:{value:(PROF.partMs/f).toFixed(2)},nodes:{value:Math.round(PROF.nodesDrawn/f)},edges:{value:Math.round(PROF.edgesDrawn/f)},particles:{value:Math.round(PROF.particlesDrawn/f)}});
  PROF.frames=PROF.totalMs=PROF.nodeMs=PROF.edgeMs=PROF.partMs=PROF.burstMs=PROF.gridMs=0;PROF.nodesDrawn=PROF.edgesDrawn=PROF.particlesDrawn=0;
}

function render(){
  if(!renderRunning)return;
  const t0=performance.now();
  try{
    physics();
    cam.z+=(camTargetZ-cam.z)*0.12;if(Math.abs(camTargetZ-cam.z)<0.001)cam.z=camTargetZ;
    ctx.fillStyle='#08080d';ctx.fillRect(0,0,W,H);
    if(autoR)cam.x+=0.3;
    const cx=W/2,cy=H/2;
    const tg=performance.now();
    ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
    drawGrid(cx,cy);PROF.gridMs+=performance.now()-tg;
    const tp=performance.now();drawParticles(cx,cy);PROF.partMs+=performance.now()-tp;
    const te=performance.now();drawEdges(cx,cy);PROF.edgeMs+=performance.now()-te;
    const tn=performance.now();drawNodes(cx,cy);PROF.nodeMs+=performance.now()-tn;
    const tb=performance.now();drawBursts();PROF.burstMs+=performance.now()-tb;
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,W,H);
    frameCount++;PROF.frames++;PROF.totalMs+=performance.now()-t0;
    if(performance.now()-lastFps>=1000){document.getElementById('sf').textContent=frameCount;frameCount=0;lastFps=performance.now();}
    if(PROF.frames>=60&&(performance.now()-PROF.lastLog)>2000){logProf();PROF.lastLog=performance.now();}
    // Update HUD readouts
    const zr=document.getElementById('zoomReadout');if(zr)zr.textContent=cam.z.toFixed(2)+'x';
    const cr=document.getElementById('coordReadout');if(cr)cr.textContent=Math.round(cam.x)+','+Math.round(cam.y);
  }catch(e){console.error('Render error:',e);}
  if(renderRunning) animFrameId=requestAnimationFrame(render);
}

function drawGrid(cx,cy){
  const gridSize=80*cam.z;
  const startX=((-cam.x*cam.z+cx)%gridSize+gridSize)%gridSize;
  const startY=((-cam.y*cam.z+cy)%gridSize+gridSize)%gridSize;
  ctx.strokeStyle='rgba(255,255,255,0.015)';ctx.lineWidth=0.5;
  for(let x=startX;x<W;x+=gridSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=startY;y<H;y+=gridSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawEdges(cx,cy){
  const lod=cam.z>0.5?'high':cam.z>0.25?'medium':'low';
  const maxEdges=lod==='high'?Math.round(Math.min(1000,800/cam.z)):lod==='medium'?500:200;
  const maxParticles=Math.round(Math.max(400,1200/cam.z));
  const vpLeft=cam.x-W/(2*cam.z)-200,vpRight=cam.x+W/(2*cam.z)+200;
  const vpTop=cam.y-H/(2*cam.z)-200,vpBottom=cam.y+H/(2*cam.z)+200;
  let drawn=0,pdrawn=0;
  for(let ei=0;ei<edges.length;ei++){
    if(drawn>=maxEdges)break;
    const e=edges[ei];const a=nodeMap.get(e.src),b=nodeMap.get(e.dst);
    if(!a||!b||!a.visible||!b.visible)continue;
    const aOut=a.x<vpLeft||a.x>vpRight||a.y<vpTop||a.y>vpBottom;
    const bOut=b.x<vpLeft||b.x>vpRight||b.y<vpTop||b.y>vpBottom;
    if(aOut&&bOut)continue;drawn++;
    const ax=(a.x-cam.x)*cam.z+cx,ay=(a.y-cam.y)*cam.z+cy;
    const bx=(b.x-cam.x)*cam.z+cx,by=(b.y-cam.y)*cam.z+cy;
    const ec=e.style.rgba;const ecFull=e.style.rgba+'1)';
    const useCurve=lod==='high';let cmx,cmy;
    if(useCurve){const mx=(ax+bx)/2,my=(ay+by)/2;const dx2=bx-ax,dy2=by-ay;const len=Math.sqrt(dx2*dx2+dy2*dy2)||1;const nx=-dy2/len,ny=dx2/len;const curve=e.style.glow?len*0.08:len*0.03;cmx=mx+nx*curve;cmy=my+ny*curve;}
    if((a.highlighted||b.highlighted||e.glow>0.1)&&lod!=='low'){
      ctx.beginPath();ctx.moveTo(ax,ay);if(useCurve)ctx.quadraticCurveTo(cmx,cmy,bx,by);else ctx.lineTo(bx,by);
      const glowAlpha=e.glow>0.1?0.1+e.glow*0.3:0.08;ctx.globalAlpha=glowAlpha;ctx.strokeStyle=ecFull;ctx.lineWidth=(5+e.glow*5)*cam.z;ctx.stroke();
      if(e.glow>0.3){ctx.beginPath();ctx.moveTo(ax,ay);if(useCurve)ctx.quadraticCurveTo(cmx,cmy,bx,by);else ctx.lineTo(bx,by);ctx.globalAlpha=e.glow*0.2;ctx.lineWidth=(2+e.glow*2)*cam.z;ctx.stroke();}
    }
    ctx.beginPath();ctx.moveTo(ax,ay);if(useCurve)ctx.quadraticCurveTo(cmx,cmy,bx,by);else ctx.lineTo(bx,by);
    const salienceAlpha=Math.max(0.1, Math.min(1.0, e.salience));
    ctx.globalAlpha=salienceAlpha*0.4+e.w*0.08+(a.highlighted||b.highlighted?0.4:0)+e.glow*0.4;ctx.strokeStyle=ecFull;
    ctx.lineWidth=(e.style.width+e.w*0.5+e.glow*2.5)*cam.z;if(e.style.dash)ctx.setLineDash(e.style.dash.map(d=>d*cam.z));ctx.stroke();if(e.style.dash)ctx.setLineDash([]);
    // Draw directional arrowhead
    if(e.style.arrow&&lod!=='low'){
      const arrowT=0.55;let ax2,ay2,dx,dy;
      if(useCurve){const mt=1-arrowT;ax2=mt*mt*ax+2*mt*arrowT*cmx+arrowT*arrowT*bx;ay2=mt*mt*ay+2*mt*arrowT*cmy+arrowT*arrowT*by;dx=(2*mt*(cmx-ax)+2*arrowT*(bx-cmx));dy=(2*mt*(cmy-ay)+2*arrowT*(by-cmy));}
      else{ax2=ax+(bx-ax)*arrowT;ay2=ay+(by-ay)*arrowT;dx=bx-ax;dy=by-ay;}
      const len=Math.sqrt(dx*dx+dy*dy)||1;const nx=dx/len,ny=dy/len;
      const perpX=-ny,perpY=nx;const arrSize=4*cam.z;
      ctx.beginPath();ctx.moveTo(ax2+nx*arrSize,ay2+ny*arrSize);ctx.lineTo(ax2-perpX*arrSize*0.6,ay2-perpY*arrSize*0.6);ctx.lineTo(ax2-perpX*arrSize*0.2,ay2-perpY*arrSize*0.2);ctx.lineTo(ax2-perpX*arrSize*0.6,ay2+perpY*arrSize*0.6);ctx.closePath();
      ctx.fillStyle=ecFull;ctx.globalAlpha=0.6;ctx.fill();
    }
    // Draw edge type label at midpoint
    if(lod==='high'&&(a.highlighted||b.highlighted||e.glow>0.1)&&e.style.label){
      let mx2,my2;if(useCurve){const mt=0.5;mx2=mt*mt*ax+2*mt*0.5*cmx+0.5*0.5*bx;my2=mt*mt*ay+2*mt*0.5*cmy+0.5*0.5*by;}else{mx2=(ax+bx)/2;my2=(ay+by)/2;}
      ctx.font=`${Math.max(8,9*cam.z)}px var(--font-mono),monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(0,0,0,0.7)';const pad=2;const tw=ctx.measureText(e.style.label).width;ctx.fillRect(mx2-tw/2-pad,my2-5-pad,tw+pad*2,10+pad*2);
      ctx.fillStyle=ecFull;ctx.fillText(e.style.label,mx2,my2);
    }
    e.glow*=0.95;
    if(lod!=='low'&&a.visible&&b.visible){
      e.nextSpawn--;
      if(e.nextSpawn<=0&&e.particles.length<2){
        const pSpeed=e.type==='contradicts'?0.01+Math.random()*0.012:0.005+Math.random()*0.008;
        const pColor=e.type==='contradicts'?e.style.color:a.rgba;
        e.particles.push({t:0,speed:pSpeed,color:pColor});e.nextSpawn=e.type==='contradicts'?15+Math.random()*20:30+Math.random()*60;
      }
      for(let i=e.particles.length-1;i>=0;i--){
        if(pdrawn>=maxParticles)break;const p=e.particles[i];p.t+=p.speed;
        if(p.t>1){e.particles.splice(i,1);continue;}
        const t=p.t;let px,py;
        if(useCurve){const mt=1-t;px=mt*mt*ax+2*mt*t*cmx+t*t*bx;py=mt*mt*ay+2*mt*t*cmy+t*t*by;}
        else{px=ax+(bx-ax)*t;py=ay+(by-ay)*t;}
        const pa=1-Math.abs(t-0.5)*2;ctx.beginPath();ctx.arc(px,py,(1.5+Math.sin(t*Math.PI)*0.5)*cam.z,0,Math.PI*2);
        ctx.fillStyle=`${p.color}${(pa*0.9).toFixed(2)})`;ctx.fill();pdrawn++;
      }
    }else{e.particles.length=0;}
  }
  ctx.globalAlpha=1;PROF.edgesDrawn+=drawn;PROF.particlesDrawn+=pdrawn;
}

function drawNodes(cx,cy){
  const time=performance.now()*0.001;const lod=cam.z>0.5?'high':cam.z>0.25?'medium':'low';
  let drawn=0;const detailCap=Math.round(Math.max(20,80/cam.z));let detailDrawn=0;
  for(const n of visNodesCache){
    if(!n.visible)continue;if(!isFinite(n.x)||!isFinite(n.y)){n.x=0;n.y=0;n.vx=0;n.vy=0;}
    const sx=(n.x-cam.x)*cam.z+cx,sy=(n.y-cam.y)*cam.z+cy;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;drawn++;
    const sz=n.size*cam.z;if(!isFinite(sz)||sz<=0)continue;
    const pulse=lod==='high'?0.85+0.15*Math.sin(time*2+n.pulse):1;
    const isHov=hovered===n,isSel=selected===n,isHL=n.highlighted;
    let effRgba=n.rgba;if(healthMode)effRgba=healthColor(n.health).prefix;
    let nodeAlpha=1;if(connectedSet&&!connectedSet.has(n.id))nodeAlpha=0.15;
    const glowAlphaBase=(isHL?0.25:isHov?0.2:0.08)*pulse*nodeAlpha;
    const allowGlow=(lod==='high'&&cam.z<2.5&&nodes.length<80)||isHov||isHL;
    if(allowGlow&&(isHov||isHL||detailDrawn<detailCap)){
      const glowSz=Math.min(sz*2.5,60);ctx.beginPath();ctx.arc(sx,sy,glowSz,0,Math.PI*2);
      ctx.globalAlpha=glowAlphaBase*0.5;ctx.fillStyle=healthMode?effRgba+'1)':n.rgbaFull;ctx.fill();ctx.globalAlpha=nodeAlpha;
      if(!isHov&&!isHL)detailDrawn++;
    }
    if(lod==='high'&&cam.z<2&&(n.imp>0.6||n.acc>3||isHL)&&(isHL||detailDrawn<detailCap)){
      const sp=Math.min(n.acc||4,8);ctx.globalAlpha=isHL?0.5:0.25*nodeAlpha;ctx.strokeStyle=n.rgbaFull;
      for(let i=0;i<sp;i++){
        const angle=(i/sp)*Math.PI*2+n.pulse*0.1;const len=sz*(1.2+Math.sin(time*1.5+i)*0.3);
        ctx.beginPath();ctx.moveTo(sx+Math.cos(angle)*sz*0.4,sy+Math.sin(angle)*sz*0.4);
        ctx.lineTo(sx+Math.cos(angle)*len,sy+Math.sin(angle)*len);ctx.lineWidth=1*cam.z;ctx.stroke();
      }
      ctx.globalAlpha=nodeAlpha;if(!isHL)detailDrawn++;
    }
    ctx.globalAlpha=nodeAlpha;
    if(healthMode){drawNodeShape(ctx,sx,sy,sz*pulse,{...n,color:`${effRgba}1)`});}
    else{drawNodeShape(ctx,sx,sy,sz*pulse,n);}
    ctx.globalAlpha=1;
    if(lod==='high'&&nodes.length<60){
      ctx.beginPath();ctx.arc(sx-sz*0.25,sy-sz*0.25,sz*0.3,0,Math.PI*2);ctx.globalAlpha=0.15;ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=nodeAlpha;
    }
    // Single-letter icon instead of emoji
    const iconSize=Math.max(8,sz*0.9*cam.z);
    if(n.icon&&isFinite(sx)&&isFinite(sy)){
      try{ctx.font=`bold ${iconSize}px var(--font-mono),monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=isHov||isSel?'#fff':'rgba(255,255,255,0.8)';ctx.fillText(n.icon,sx,sy+0.5);}catch{}
    }
    if(isSel){
      ctx.beginPath();ctx.arc(sx,sy,sz+6,0,Math.PI*2);ctx.strokeStyle=n.color;ctx.lineWidth=2*cam.z;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
    }
    if(isHov){
      const hoverPulse=0.6+0.4*Math.sin(time*4);
      ctx.beginPath();ctx.arc(sx,sy,sz+8+Math.sin(time*3)*2,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,255,255,${(0.15+hoverPulse*0.15).toFixed(2)})`;ctx.lineWidth=1.5*cam.z;ctx.stroke();
      ctx.beginPath();ctx.arc(sx,sy,sz+14,0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,0.06)`;ctx.lineWidth=1*cam.z;ctx.stroke();
    }
    if(showLabels&&lod!=='low'){
      const fontSize=Math.max(9,11*cam.z);
      ctx.font=`${fontSize}px var(--font-mono),monospace`;ctx.textAlign='center';
      ctx.fillStyle=isHov||isSel?'#fff':isHL?n.color:connectedSet&&!connectedSet.has(n.id)?'#333':'#666';
      const lbl=(n.label||'').length>24?(n.label||'').substring(0,22)+'...':(n.label||'');
      ctx.fillText(lbl,sx,sy+sz+fontSize+3);
      // Namespace prefix when zoomed in close
      if(cam.z>1.5&&n.ns){
        ctx.font=`${Math.max(8,fontSize*0.75)}px var(--font-mono),monospace`;
        ctx.fillStyle=connectedSet&&!connectedSet.has(n.id)?'#222':'#444';
        ctx.fillText(n.ns,sx,sy+sz+fontSize+3+fontSize*0.85);
      }
    }
    if(n.glowTrail.length>3)n.glowTrail.length=3;
    if(n.glowTrail.length>0&&lod!=='low'){
      ctx.strokeStyle=n.rgbaFull;
      for(let i=n.glowTrail.length-1;i>=0;i--){
        const g=n.glowTrail[i];g.life-=0.03;if(g.life<=0){n.glowTrail.splice(i,1);continue;}
        ctx.beginPath();ctx.arc(sx,sy,sz*2*g.life,0,Math.PI*2);ctx.globalAlpha=g.life*0.3;ctx.lineWidth=1.5*cam.z;ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  }
  PROF.nodesDrawn+=drawn;
}

function drawNodeShape(c,x,y,s,n){
  const shape=TC[n.type]?.shape||'circle';
  const status=n.status||'open';
  // Draw status indicator ring
  const statusColors={supported:'#00ff88',open:'#0088ff',refuted:'#ff4444',inconclusive:'#F5C518',blocked:'#888888'};
  const sc=statusColors[status]||statusColors.open;
  if(status!=='open'){
    c.beginPath();c.arc(x,y,s+3,0,Math.PI*2);
    c.strokeStyle=sc;c.lineWidth=2;c.globalAlpha=0.6;c.stroke();c.globalAlpha=1;
  }
  // Draw confirmation dots
  const conf=n.confirmation_count||0;
  if(conf>0){
    const dotR=Math.max(2,s*0.12);const dotOffset=s+6;
    for(let i=0;i<Math.min(conf,5);i++){
      const angle=(i/5)*Math.PI*2-Math.PI/2;
      c.beginPath();c.arc(x+Math.cos(angle)*dotOffset,y+Math.sin(angle)*dotOffset,dotR,0,Math.PI*2);
      c.fillStyle='#00ff88';c.globalAlpha=0.7;c.fill();c.globalAlpha=1;
    }
  }
  switch(shape){
    case'diamond':drawDiamond(c,x,y,s,n.color);break;
    case'triangle':drawTriangle(c,x,y,s,n.color);break;
    case'rounded':drawRoundedSquare(c,x,y,s,n.color);break;
    case'bubble':drawSpeechBubble(c,x,y,s,n.color);break;
    case'tag':drawTag(c,x,y,s,n.color);break;
    case'person':drawPerson(c,x,y,s,n.color);break;
    case'calendar':drawCalendar(c,x,y,s,n.color);break;
    case'cloud':drawCloud(c,x,y,s,n.color);break;
    case'gear':drawGear(c,x,y,s,n.color);break;
    case'hex':drawHex(c,x,y,s,n.color);break;
    default:drawCircle(c,x,y,s,n.color);break;
  }
}

function drawDiamond(c,x,y,s,color){
  c.beginPath();c.moveTo(x,y-s);c.lineTo(x+s*0.7,y);c.lineTo(x,y+s);c.lineTo(x-s*0.7,y);c.closePath();
  c.fillStyle=color;c.fill();
  c.beginPath();c.moveTo(x-s*0.2,y-s*0.6);c.lineTo(x+s*0.3,y-s*0.1);c.lineTo(x-s*0.1,y-s*0.2);c.closePath();
  c.fillStyle='rgba(255,255,255,0.12)';c.fill();
}

function drawTriangle(c,x,y,s,color){
  c.beginPath();c.moveTo(x,y-s*1.1);c.lineTo(x+s,y+s*0.7);c.lineTo(x-s,y+s*0.7);c.closePath();
  c.fillStyle=color;c.fill();
  c.beginPath();c.moveTo(x,y-s*0.8);c.lineTo(x+s*0.4,y-s*0.1);c.lineTo(x-s*0.4,y-s*0.1);c.closePath();
  c.fillStyle='rgba(255,255,255,0.1)';c.fill();
}

function drawRoundedSquare(c,x,y,s,color){
  const r=s*0.3;
  c.beginPath();c.moveTo(x-s+r,y-s);c.lineTo(x+s-r,y-s);c.quadraticCurveTo(x+s,y-s,x+s,y-s+r);
  c.lineTo(x+s,y+s-r);c.quadraticCurveTo(x+s,y+s,x+s-r,y+s);c.lineTo(x-s+r,y+s);
  c.quadraticCurveTo(x-s,y+s,x-s,y+s-r);c.lineTo(x-s,y-s+r);c.quadraticCurveTo(x-s,y-s,x-s+r,y-s);c.closePath();
  c.fillStyle=color;c.fill();
  c.fillStyle='rgba(255,255,255,0.1)';c.fillRect(x-s*0.5,y-s*0.5,s,s*0.4);
}

function drawSpeechBubble(c,x,y,s,color){
  c.beginPath();c.arc(x,y-s*0.2,s*0.8,Math.PI*0.1,Math.PI*0.9);c.lineTo(x+s*0.3,y+s*0.3);
  c.lineTo(x+s*0.1,y+s*0.1);c.lineTo(x-s*0.3,y+s*0.3);c.closePath();
  c.fillStyle=color;c.fill();
  c.beginPath();c.arc(x-s*0.1,y-s*0.3,s*0.15,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.15)';c.fill();
}

function drawTag(c,x,y,s,color){
  c.beginPath();c.moveTo(x-s,y-s*0.5);c.lineTo(x+s*0.5,y-s*0.5);c.lineTo(x+s,y);c.lineTo(x+s*0.5,y+s*0.5);c.lineTo(x-s,y+s*0.5);c.closePath();
  c.fillStyle=color;c.fill();
  c.beginPath();c.arc(x-s*0.6,y,2,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.3)';c.fill();
}

function drawPerson(c,x,y,s,color){
  c.beginPath();c.arc(x,y-s*0.3,s*0.4,0,Math.PI*2);c.fillStyle=color;c.fill();
  c.beginPath();c.moveTo(x-s*0.5,y+s*0.5);c.quadraticCurveTo(x-s*0.5,y-s*0.1,x,y-s*0.1);c.quadraticCurveTo(x+s*0.5,y-s*0.1,x+s*0.5,y+s*0.5);c.closePath();
  c.fillStyle=color;c.fill();
  c.beginPath();c.arc(x,y-s*0.3,s*0.15,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.15)';c.fill();
}

function drawCalendar(c,x,y,s,color){
  c.fillStyle=color;c.fillRect(x-s*0.7,y-s*0.6,s*1.4,s*1.2);
  c.fillStyle='rgba(255,255,255,0.2)';c.fillRect(x-s*0.7,y-s*0.6,s*1.4,s*0.25);
  c.fillStyle='rgba(255,255,255,0.1)';c.fillRect(x-s*0.4,y,s*0.3,s*0.3);c.fillRect(x,y,s*0.3,s*0.3);
}

function drawCloud(c,x,y,s,color){
  c.beginPath();c.arc(x-s*0.3,y,s*0.35,0,Math.PI*2);c.arc(x+s*0.3,y,s*0.35,0,Math.PI*2);
  c.arc(x,y-s*0.2,s*0.4,0,Math.PI*2);c.fillStyle=color;c.fill();
  c.beginPath();c.arc(x-s*0.1,y-s*0.3,s*0.15,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.1)';c.fill();
}

function drawGear(c,x,y,s,color){
  const teeth=8;const innerR=s*0.5;const outerR=s*0.8;
  c.beginPath();
  for(let i=0;i<teeth*2;i++){
    const r=i%2===0?outerR:innerR;const a=(i/(teeth*2))*Math.PI*2-Math.PI/2;
    i===0?c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
  }
  c.closePath();c.fillStyle=color;c.fill();
  c.beginPath();c.arc(x,y,s*0.25,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.15)';c.fill();
}

function drawCircle(c,x,y,s,color){
  c.beginPath();c.arc(x,y,s,0,Math.PI*2);c.fillStyle=color;c.fill();
  if(s>4){c.beginPath();c.arc(x-s*0.25,y-s*0.25,s*0.22,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.15)';c.fill();}
}
function drawStar(c,x,y,spikes,innerR,outerR,color){c.beginPath();for(let i=0;i<spikes*2;i++){const r=i%2===0?outerR:innerR;const a=(i/(spikes*2))*Math.PI*2-Math.PI/2;i===0?c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();c.fillStyle=color;c.fill();}
function drawHex(c,x,y,r,color){c.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;i===0?c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();c.fillStyle=color;c.fill();}

// === Ambient Particles ===
const MAX_PARTICLES=80;
function initParticles(){
  for(let i=0;i<MAX_PARTICLES;i++){
    let color;const r=Math.random();
    if(r<0.06)color=[0,255,136];else if(r<0.10)color=[0,136,255];else if(r<0.13)color=[255,170,0];
    else if(r<0.15)color=[255,0,255];else if(r<0.17)color=[255,68,68];else if(r<0.20)color=[0,255,255];
    else color=[40+Math.random()*30,40+Math.random()*30,60+Math.random()*30];
    particles.push({x:(Math.random()-0.5)*3000,y:(Math.random()-0.5)*3000,
      vx:(Math.random()-0.5)*0.08,vy:(Math.random()-0.5)*0.08,
      alpha:0.02+Math.random()*0.06,size:0.3+Math.random()*1.2,color:color});
  }
}
function drawParticles(cx,cy){
  const margin=100;
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;if(p.x<-1000)p.x=1000;if(p.x>1000)p.x=-1000;if(p.y<-1000)p.y=1000;if(p.y>1000)p.y=-1000;
    const sx=(p.x-cam.x)*cam.z+cx,sy=(p.y-cam.y)*cam.z+cy;
    if(sx<-margin||sx>W+margin||sy<-margin||sy>H+margin)continue;
    const r=Math.max(0.1,p.size*Math.abs(cam.z));ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${p.color[0]},${p.color[1]},${p.color[2]},${p.alpha})`;ctx.fill();
  }
}

// === Burst Effects ===
function triggerBurst(nodeId,color){
  const n=nodeMap.get(nodeId);if(!n)return;if(bursts.length>20)bursts.splice(0,bursts.length-20);
  const cx=W/2,cy=H/2;const sx=(n.x-cam.x)*cam.z+cx,sy=(n.y-cam.y)*cam.z+cy;
  bursts.push({x:sx,y:sy,t:0,color:n.rgba,size:n.size*cam.z*2});
  for(const e of edges){if(e.src===nodeId||e.dst===nodeId)e.glow=1;}
  n.glowTrail.push({life:1});
}
function drawBursts(){
  bctx.clearRect(0,0,W,H);
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.t+=0.015;if(b.t>1){bursts.splice(i,1);continue;}
    const r=b.size*(1+b.t*4);const alpha=(1-b.t)*0.5;
    bctx.beginPath();bctx.arc(b.x,b.y,r,0,Math.PI*2);bctx.strokeStyle=`${b.color}${(alpha*0.6).toFixed(2)})`;bctx.lineWidth=2.5*(1-b.t);bctx.stroke();
    const r2=b.size*(1+b.t*2.5);bctx.beginPath();bctx.arc(b.x,b.y,r2,0,Math.PI*2);bctx.strokeStyle=`${b.color}${(alpha*0.3).toFixed(2)})`;bctx.lineWidth=1.5*(1-b.t);bctx.stroke();
    bctx.beginPath();bctx.arc(b.x,b.y,r*0.4,0,Math.PI*2);bctx.globalAlpha=alpha*0.25;bctx.fillStyle=b.color+'1)';bctx.fill();bctx.globalAlpha=1;
    for(let j=0;j<8;j++){const angle=(j/8)*Math.PI*2+b.t*4;const pr=r*0.85;const px=b.x+Math.cos(angle)*pr,py=b.y+Math.sin(angle)*pr;bctx.beginPath();bctx.arc(px,py,1.8*(1-b.t),0,Math.PI*2);bctx.fillStyle=`${b.color}${alpha})`;bctx.fill();}
  }
}

// === Real-Time Hermes Recall Integration ===
let lastSnapshotHash='',lastGraphCheck=0,pollBusy=false;
async function pollHermesRecalls(){
  if(pollBusy)return;pollBusy=true;
  try{
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),4000);
    const resp=await fetch('/api/v1/snapshot?namespace='+(nsFilter||'hermes'),{signal:controller.signal});
    clearTimeout(timer);const snap=await resp.json();
    if(snap&&snap.content){
      const hash=snap.content.length+':'+snap.token_count;
      if(hash!==lastSnapshotHash){
        lastSnapshotHash=hash;const snapNodes=[];const snapLower=snap.content.toLowerCase();
        for(const n of nodes){if(snapNodes.length>=3)break;if(snapLower.includes(n.label.toLowerCase().substring(0,15)))snapNodes.push(n);}
        if(snapNodes.length>0){
          addFeedItem('snapshot',`Snapshot: ${snap.token_count} tokens, ${snapNodes.length} memories`,snapNodes.map(n=>n.id));
          showRecallPopup(snapNodes[0].id,`Snapshot: ${snap.token_count} tokens`,'snapshot');suppressSimRecall();
        }
      }
    }
  }catch(e){}
  const now=Date.now();if(now-lastGraphCheck>=15000){
    try{
      const gc=new AbortController();const gTimer=setTimeout(()=>gc.abort(),5000);
      const countResp=await fetch('/api/v1/nodes?limit=1&count=true',{signal:gc.signal});
      clearTimeout(gTimer);const countData=await countResp.json();lastGraphCheck=Date.now();
      const remoteCount=countData.count||countData.total||countData.length||0;
      if(typeof remoteCount==='number'&&remoteCount!==lastNodeCount){
        const delta=Math.abs(remoteCount-lastNodeCount);
        if(delta>=5){
          const fullGraph=await(await fetch('/api/v1/graph?limit=200')).json();buildGraph(fullGraph);
          nodes.forEach(n=>{n.visible=(!nsFilter||n.ns===nsFilter)&&(!typeFilter||n.type===typeFilter);});
          rebuildVisCache();wakeRender();renderDataSidebar(fullGraph);renderNamespaceChips(fullGraph);
          document.getElementById('sn').textContent=lastNodeCount;
          try{const ec=await(await fetch('/api/v1/edges?count=true')).json();document.getElementById('se').textContent=ec.count||fullGraph.edges.length;}catch(e){document.getElementById('se').textContent=fullGraph.edges.length;}
          toast(`${delta>0?'+':''}${delta} nodes, graph refreshed`);suppressSimRecall();
        }
        lastNodeCount=remoteCount;
      }
      if(remoteCount<=300){
        const g=await(await fetch('/api/v1/nodes?limit='+Math.min(remoteCount,200))).json();
        if(Array.isArray(g)){
          for(const remote of g){
            if(remote.namespace==='test')continue;const local=nodeMap.get(remote.id);
            if(local&&remote.access_count>local.acc){
              const delta=remote.access_count-local.acc;local.acc=remote.access_count;
              const tc=TC[local.type]||TC.concept;
              local.size=tc.s*Math.min(1.4,0.6+Math.min(local.imp||0.5,1)*0.4+Math.log2(1+Math.min(local.acc||0,100))*0.08);
              addFeedItem('recall',`Recalled: ${(local.label||'').substring(0,35)} (+${delta}x)`,[local.id]);
              showRecallPopup(local.id,`${(local.label||'').substring(0,25)}`,'recall');suppressSimRecall();
            }
          }
        }
      }
      try{
        const nsResp=await fetch('/api/v1/nodes?limit=1&count=true&group_by=namespace');
        if(nsResp.ok){const nsData=await nsResp.json();if(nsData&&nsData.namespaces){nsCountsCache=nsData.namespaces;renderNamespaceChips(null);}}
      }catch(e){}
    }catch(e){}
  }
  pollBusy=false;
}

// === Simulated Recall ===
let simSuppressedUntil=0;
function suppressSimRecall(){simSuppressedUntil=Date.now()+60000;}
function simulateRecall(){
  if(nodes.length===0)return;if(Date.now()<simSuppressedUntil)return;
  const visNodes=nodes.filter(n=>n.visible);if(visNodes.length===0)return;
  const randomNode=visNodes[Math.floor(Math.random()*visNodes.length)];
  const types=['search','ask','recall'];const type=types[Math.floor(Math.random()*types.length)];
  const texts={search:`Search: "${(randomNode.label||'').substring(0,25)}"`,ask:`Query: "What about ${(randomNode.label||'').substring(0,20)}?"`,recall:`Recalled: ${(randomNode.label||'').substring(0,30)}`};
  const connected=edges.filter(e=>(e.src===randomNode.id||e.dst===randomNode.id)).map(e=>e.src===randomNode.id?e.dst:e.src).filter(id=>{const nd=nodeMap.get(id);return nd&&nd.visible;}).slice(0,3);
  addFeedItem(type,texts[type],[randomNode.id,...connected]);showRecallPopup(randomNode.id,texts[type],type);
}

}
async function focusNode(id){
  const n=nodeMap.get(id);if(n){cam.x=n.x;cam.y=n.y;selected=n;showNodePanel(n);triggerBurst(n.id);}
}
async function deleteCurrentNode(){
  const btn=document.getElementById('delBtn');
  const id=btn.dataset.nid;if(!id)return;
  const n=nodeMap.get(id);const label=n?n.label:id.substring(0,12);
  if(!confirm(`Delete "${label}"? This cannot be undone.`))return;
  btn.disabled=true;btn.textContent='Deleting...';
  try{
    const r=await fetch('/api/v1/nodes/'+id,{method:'DELETE'});
    if(!r.ok){toast('Delete failed: '+r.status);btn.disabled=false;btn.textContent='Delete Node';return;}
    // Remove from data structures
    nodes=nodes.filter(x=>x.id!==id);
    edges=edges.filter(e=>e.source!==id&&e.target!==id);
    nodeMap.delete(id);
    if(selectedNode===id){selectedNode=null;connectedSet=null;}
    if(selected&&selected.id===id){selected=null;}
    document.getElementById('pnl').classList.remove('open');
    toast(`Deleted "${label}"`);
  }catch(e){
    toast('Delete error: '+e.message);
    btn.disabled=false;btn.textContent='Delete Node';
  }
}
function resetCam(){cam.x=0;cam.y=0;cam.z=1;camTargetZ=1;}
function zoomFit(){
  if(!nodes.length)return;const v=nodes.filter(n=>n.visible);if(!v.length)return;
  let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
  for(const n of v){mnX=Math.min(mnX,n.x-n.size);mnY=Math.min(mnY,n.y-n.size);mxX=Math.max(mxX,n.x+n.size);mxY=Math.max(mxY,n.y+n.size);}
  const cw=canvas.width-120,ch=canvas.height-120;const dX=mxX-mnX||1,dY=mxY-mnY||1;
  const s=Math.min(cw/dX,ch/dY,3);camTargetZ=s;cam.x=-(mnX+mxX)/2;cam.y=-(mnY+mxY)/2;
}
function toast(m){const t=document.getElementById('tst');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function renderLegend(data){
  const types=new Set(data.nodes.map(n=>n.node_type));const el=document.getElementById('legitems');
  el.innerHTML=`<div class="legend-item ${!typeFilter?'active':''}" data-type="" style="cursor:pointer" onclick="filterByType('')"><div class="legend-dot" style="background:#888"></div>Show All</div>`+
    Object.entries(TC).filter(([t])=>types.has(t)).map(([t,tc])=>
    `<div class="legend-item ${typeFilter===t?'active':''}" data-type="${t}" style="cursor:pointer" onclick="filterByType('${t}')"><div class="legend-dot" style="background:${tc.c};box-shadow:0 0 4px ${tc.c}"></div>${tc.icon} ${t}</div>`
  ).join('');
}

document.onkeydown=e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape')document.getElementById('pnl').classList.remove('open');
  if(e.key==='r'&&!e.ctrlKey)resetCam();
};

function updateEmptyState(){
  const el=document.getElementById('emptyState');if(el)el.style.display=nodes.length===0?'block':'none';
}

// === Init ===
initParticles();load();render();

// Real-time polling every 15s
const pollInterval=setInterval(()=>{if(!document.hidden)pollHermesRecalls();},15000);

// Fallback simulation
function scheduleSim(){simTimer=setTimeout(()=>{simulateRecall();scheduleSim();},10000+Math.random()*10000);}
setTimeout(scheduleSim,12000);

// Pause rendering when tab is hidden
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){renderRunning=false;if(animFrameId){cancelAnimationFrame(animFrameId);animFrameId=null;}if(simTimer){clearTimeout(simTimer);simTimer=null;}}
  else{if(!renderRunning){renderRunning=true;if(animFrameId){cancelAnimationFrame(animFrameId);}animFrameId=requestAnimationFrame(render);}if(!simTimer)scheduleSim();}
});
</script>
</body>
</html>
