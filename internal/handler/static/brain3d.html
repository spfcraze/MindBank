<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBank — Brain 3D</title>
    <link rel="stylesheet" href="brain3d.css?v=2">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>🧠 MindBank Brain 3D</h1>
            <div class="controls">
                <!-- View Modes -->
                <div class="view-modes">
                    <button id="mode-full" class="mode-btn active" onclick="setViewMode('full')">Full</button>
                    <button id="mode-micro" class="mode-btn" onclick="setViewMode('micro')">Micro</button>
                    <button id="mode-macro" class="mode-btn" onclick="setViewMode('macro')">Macro</button>
                </div>
                <!-- Search -->
                <input type="text" id="search-input" placeholder="Search nodes..." 
                       oninput="searchNodes(this.value)"
                       style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:6px 14px;border-radius:6px;font-size:13px;width:180px;">
                <!-- Controls -->
                <select id="topic-filter" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:0.25rem 0.5rem;border-radius:0.25rem;font-size:0.875rem;">
                    <option value="">All Topics</option>
                    <option value="deployment">Deployment</option>
                    <option value="database">Database</option>
                    <option value="api">API</option>
                    <option value="auth">Auth</option>
                    <option value="frontend">Frontend</option>
                    <option value="bugfix">Bugfix</option>
                    <option value="refactoring">Refactoring</option>
                    <option value="testing">Testing</option>
                    <option value="config">Config</option>
                    <option value="architecture">Architecture</option>
                </select>
                <select id="namespace-filter">
                    <option value="">All namespaces</option>
                </select>
                <button id="reset-cam">Reset Cam</button>
                <a href="/" class="back">← Dashboard</a>
            </div>
        </header>

        <main id="canvas-container">
            <div id="loading">Loading 3D brain...</div>
            <div id="error-display" style="display:none; color:#ef4444; padding:20px; font-family:monospace;"></div>
            
            <!-- Stats Overlay -->
            <div id="stats-overlay">
                <div class="stat"><span class="stat-val" id="stat-nodes">-</span> nodes</div>
                <div class="stat"><span class="stat-val" id="stat-edges">-</span> edges</div>
                <div class="stat"><span class="stat-val" id="stat-projects">-</span> projects</div>
                <div class="stat"><span class="stat-val" id="stat-sessions">-</span> sessions</div>
            </div>

            <!-- Edge Legend -->
            <div id="edge-legend">
                <div class="legend-title">Edge Types</div>
                <div class="legend-item"><span class="legend-color" style="background:#4ecdc4;"></span> depends_on / supports</div>
                <div class="legend-item"><span class="legend-color" style="background:#a78bfa;"></span> influences</div>
                <div class="legend-item"><span class="legend-color" style="background:#ff6b35;"></span> contradicts</div>
                <div class="legend-item"><span class="legend-color" style="background:#404040;"></span> relates_to</div>
                <div class="legend-item"><span class="legend-color" style="background:#3b82f6;"></span> contains</div>
            </div>
        </main>

        <aside id="info-panel" class="hidden">
            <button class="close">×</button>
            <div class="content"></div>
        </aside>

        <div id="tooltip"></div>
    </div>

    <script type="module">
        import init, { PhysicsEngine } from './pkg/brain3d_physics.js';
        import { Brain3D } from './brain3d.js?v=2';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        window.EffectComposer = EffectComposer;
        window.RenderPass = RenderPass;
        window.UnrealBloomPass = UnrealBloomPass;

        const loading = document.getElementById('loading');
        const errorDisplay = document.getElementById('error-display');
        let brain;

        function showError(msg) {
            loading.style.display = 'none';
            errorDisplay.style.display = 'block';
            errorDisplay.textContent = 'ERROR: ' + msg;
            console.error(msg);
        }

        async function main() {
            try {
                loading.textContent = 'Initializing WASM physics...';
                await init();
                loading.textContent = 'WASM loaded. Creating 3D scene...';

                const container = document.getElementById('canvas-container');
                brain = new Brain3D(container);
                window.brain = brain;
                loading.textContent = 'Scene created. Fetching graph data...';

                const namespace = new URLSearchParams(location.search).get('namespace') || '';
                const url = namespace ? `/api/v1/graph?limit=2000&namespace=${encodeURIComponent(namespace)}` : '/api/v1/graph?limit=2000';

                console.log('[Brain3D] Fetching:', url);
                let res;
                try {
                    res = await fetch(url);
                } catch (fetchErr) {
                    throw new Error('Network error: ' + fetchErr.message);
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                console.log('[Brain3D] Loaded:', data.nodes.length, 'nodes,', data.edges.length, 'edges');
                loading.textContent = `Loaded ${data.nodes.length} nodes. Building visualization...`;

                // Separate signal from noise
                const projectNodes = data.nodes.filter(n => n.node_type === 'project' || n.namespace !== 'global');
                const sessionNodes = data.nodes.filter(n => n.node_type === 'session' && n.namespace === 'global');
                
                const orderedNodes = [...projectNodes, ...sessionNodes];
                const orderedNodeIdToIndex = {};
                orderedNodes.forEach((n, i) => orderedNodeIdToIndex[n.id] = i);
                brain.nodeIdToIndex = orderedNodeIdToIndex;
                brain.nodes = orderedNodes;
                brain.projectCount = projectNodes.length;

                // Position nodes
                const positions = calculateLayout(projectNodes, sessionNodes, data.edges, orderedNodeIdToIndex);
                brain.nodePositions = positions;

                // Build scene
                brain.createNodes(orderedNodes, projectNodes.length);
                brain.updateNodePositions(positions);
                brain.createEdges(data.edges, positions);

                // Update stats
                updateStats(data.nodes.length, data.edges.length, projectNodes.length, sessionNodes.length);

                loading.style.display = 'none';

                // Initialize view mode
                brain.setViewMode('full');

                // Calculate layout
                function calculateLayout(projects, sessions, edges, nodeIdToIndex) {
                    const total = projects.length + sessions.length;
                    const pos = new Float32Array(total * 3);
                    const spacing = 15;

                    // Projects in circle
                    projects.forEach((p, i) => {
                        const a = (i / Math.max(projects.length, 1)) * Math.PI * 2 - Math.PI / 2;
                        pos[i * 3] = Math.cos(a) * spacing;
                        pos[i * 3 + 1] = 0;
                        pos[i * 3 + 2] = Math.sin(a) * spacing;
                    });

                    // Sessions: cluster around connected projects
                    const topicToProject = {
                        deployment: 0, database: 0, api: 1, auth: 1, frontend: 1,
                        bugfix: 2, refactoring: 2, testing: 2, config: 1, architecture: 1, general: 0
                    };

                    const byTopic = {};
                    sessions.forEach((s, i) => {
                        const topic = (s.metadata && s.metadata.topic) ? s.metadata.topic : 'general';
                        if (!byTopic[topic]) byTopic[topic] = [];
                        byTopic[topic].push({idx: projects.length + i, sess: s});
                    });

                    Object.entries(byTopic).forEach(([topic, group]) => {
                        const tp = topicToProject[topic] || 0;
                        const px = pos[tp * 3], pz = pos[tp * 3 + 2];
                        const r = 5 + (Object.keys(byTopic).indexOf(topic) % 3) * 2;
                        group.forEach((item, j) => {
                            const a = (j / Math.max(group.length, 1)) * Math.PI * 2;
                            pos[item.idx * 3] = px + Math.cos(a) * r;
                            pos[item.idx * 3 + 1] = (Math.sin(j * 0.3) * 2) + 1;
                            pos[item.idx * 3 + 2] = pz + Math.sin(a) * r;
                        });
                    });

                    return pos;
                }

                function updateStats(nodes, edges, projects, sessions) {
                    document.getElementById('stat-nodes').textContent = nodes;
                    document.getElementById('stat-edges').textContent = edges;
                    document.getElementById('stat-projects').textContent = projects;
                    document.getElementById('stat-sessions').textContent = sessions;
                }

                // Namespace filter
                const namespaces = [...new Set(data.nodes.map(n => n.namespace))].sort();
                const nsFilter = document.getElementById('namespace-filter');
                namespaces.forEach(ns => {
                    const opt = document.createElement('option');
                    opt.value = ns; opt.textContent = ns;
                    nsFilter.appendChild(opt);
                });
                nsFilter.addEventListener('change', () => {
                    const ns = nsFilter.value;
                    location.href = ns ? `/brain-3d?namespace=${encodeURIComponent(ns)}` : '/brain-3d';
                });

                // Topic filter
                document.getElementById('topic-filter').addEventListener('change', () => {
                    brain.setTopicFilter(document.getElementById('topic-filter').value);
                });

                // Reset camera
                document.getElementById('reset-cam').addEventListener('click', () => {
                    brain.camera.position.set(0, 25, 20);
                    brain.camera.lookAt(0, 0, 0);
                    brain.controls.target.set(0, 0, 0);
                    brain.controls.update();
                });

            } catch (e) {
                showError(e.message + '\n' + e.stack);
            }
        }

        // View mode switcher (global function)
        function setViewMode(mode) {
            if (!brain) return;
            // Update button states
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('mode-' + mode);
            if (btn) btn.classList.add('active');
            brain.setViewMode(mode);
        }

        // Search (global function)
        function searchNodes(query) {
            if (!brain) return;
            brain.searchNodes(query);
        }

        main();
    </script>
</body>
</html>
