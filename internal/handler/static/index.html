<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIND_BANK // GRAPH_MEMORY_INTERFACE</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#050608;--bg-panel:rgba(11,14,20,0.85);--bg-glass:rgba(15,20,30,0.6);
      --text:#E8ECF0;--text-dim:#6B7B8F;--text-faint:#8A9AAA;
      --cyan:#00D4AA;--magenta:#EC4899;--green:#39FF14;--blue:#3B82F6;--yellow:#F5C518;--red:#EF4444;
      --border:rgba(0,212,170,0.15);--border-glow:rgba(0,212,170,0.4);--grid:rgba(0,212,170,0.04);
      --font-mono:'JetBrains Mono','Fira Code','SF Mono',monospace;
      --font-sans:'Inter',-apple-system,sans-serif;
      --surface:#0c0c12;--surface-raised:#1a1a24;
    }
    body{font-family:var(--font-mono);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
    body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);pointer-events:none;z-index:0;opacity:0.3}
    @keyframes glitch{0%{clip-path:inset(40% 0 61% 0);transform:translate(-2px,2px)}20%{clip-path:inset(92% 0 1% 0);transform:translate(2px,-2px)}40%{clip-path:inset(43% 0 1% 0);transform:translate(-2px,2px)}60%{clip-path:inset(25% 0 58% 0);transform:translate(2px,-2px)}80%{clip-path:inset(54% 0 7% 0);transform:translate(-2px,2px)}100%{clip-path:inset(58% 0 43% 0);transform:translate(2px,-2px)}}
    @keyframes pulse-glow{0%,100%{box-shadow:0 0 5px var(--cyan),0 0 10px rgba(0,212,170,0.3)}50%{box-shadow:0 0 15px var(--cyan),0 0 30px rgba(0,212,170,0.5)}}
    @keyframes pulse-border{0%,100%{border-color:rgba(0,212,170,0.2)}50%{border-color:rgba(0,212,170,0.6)}}
    @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes blink-update{0%,100%{color:var(--yellow);text-shadow:0 0 5px var(--yellow),0 0 10px rgba(245,197,24,0.3)}50%{color:#fff;text-shadow:0 0 15px var(--yellow),0 0 30px rgba(245,197,24,0.6)}}
    .scan-line{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0.5;animation:scan 6s linear infinite;pointer-events:none;z-index:100}
    .glitch{position:relative}
    .glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;opacity:0}
    /* ... (rest of existing CSS preserved) ... */
    #pixi-canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:auto;opacity:0;transition:opacity 0.5s}
    #pixi-canvas-container.active{opacity:1}
    #legacy-ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:auto;opacity:1;transition:opacity 0.5s}
    #legacy-ui.hidden{opacity:0;pointer-events:none}
    .mode-toggle{position:fixed;bottom:20px;right:20px;z-index:100;padding:8px 16px;background:var(--bg-panel);border:1px solid var(--border);color:var(--cyan);font-family:var(--font-mono);font-size:11px;cursor:pointer;transition:all 0.3s}
    .mode-toggle:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,212,170,0.3)}
  </style>
</head>
<body>
  <div class="scan-line"></div>
  <div id="pixi-canvas-container"></div>
  <div id="legacy-ui">
    <iframe src="./index-legacy.html" style="width:100%;height:100%;border:none;"></iframe>
  </div>
  <button class="mode-toggle" onclick="toggleMode()" id="modeToggle">SWITCH TO PIXI</button>
  
  <script type="module" crossorigin src="./assets/index-BafeXYO0.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/pixi-C2AFJ7j0.js">
  <script>
    let pixiMode = false;
    function toggleMode() {
      pixiMode = !pixiMode;
      const legacy = document.getElementById('legacy-ui');
      const pixi = document.getElementById('pixi-canvas-container');
      const toggle = document.getElementById('modeToggle');
      if (pixiMode) {
        legacy.classList.add('hidden');
        pixi.classList.add('active');
        toggle.textContent = 'SWITCH TO LEGACY';
        window.dispatchEvent(new CustomEvent('piximode', { detail: { active: true } }));
      } else {
        legacy.classList.remove('hidden');
        pixi.classList.remove('active');
        toggle.textContent = 'SWITCH TO PIXI';
        window.dispatchEvent(new CustomEvent('piximode', { detail: { active: false } }));
      }
    }
  </script>
</body>
</html>
